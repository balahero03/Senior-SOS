# docker-compose.yml
# Local development stack — starts the databases used by the current app.
# Start with: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: seniorsos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: seniorsos_user
      POSTGRES_PASSWORD: seniorsos_pass
      POSTGRES_DB: seniorsos
    ports:
      # Keep the host's default PostgreSQL port available for other projects.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seniorsos_user -d seniorsos"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: seniorsos-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mongodb_data:
