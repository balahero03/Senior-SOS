# k8s/frontend/frontend.yaml
# nginx serving the built React app. It also forwards /api and /socket.io to the
# "backend" Service, so the browser only ever talks to this one address.
#
# As with the backend, the replica count belongs to the autoscaler (2 to 3).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    app.kubernetes.io/part-of: seniorsos
spec:
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: frontend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend
          image: seniorsos-frontend:local
          imagePullPolicy: IfNotPresent
          env:
            # Where nginx sends /api and /socket.io: the backend Service. nginx's
            # resolver does not apply the pod's DNS search domains, so the short
            # name "backend" would not resolve; use the full service name
            # (<service>.<namespace>.svc.cluster.local). nginx re-resolves it on
            # every request, so it keeps working as backend pods are replaced.
            - name: BACKEND_HOST
              value: backend.seniorsos.svc.cluster.local:5000
          ports:
            - name: http
              containerPort: 80
          lifecycle:
            preStop:
              exec:
                # Let in-flight requests finish before nginx is stopped.
                command: ["sleep", "5"]
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
---
# The only thing exposed outside the cluster. On Docker Desktop a LoadBalancer
# Service is reachable on localhost, so the app opens at http://localhost:8080.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
    app.kubernetes.io/part-of: seniorsos
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  labels:
    app.kubernetes.io/part-of: seniorsos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  labels:
    app.kubernetes.io/part-of: seniorsos
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend
